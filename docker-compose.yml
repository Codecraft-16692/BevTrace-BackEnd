# Local environment: MySQL + the API. `docker compose up --build`
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bevtrace
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: db
      DATABASE_PORT: "3306"
      DATABASE_NAME: bevtrace
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      JWT_SECRET: change-this-secret-with-at-least-32-characters
      SWAGGER_ENABLED: "true"
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
