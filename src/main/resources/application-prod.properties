# Production profile

spring.datasource.url=jdbc:mysql://${DATABASE_URL}:${DATABASE_PORT:3306}/${DATABASE_NAME}?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=false&allowPublicKeyRetrieval=true

spring.datasource.username=${DATABASE_USER}

spring.datasource.password=${DATABASE_PASSWORD}

# Production-lean JPA behavior
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Swagger (off by default)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# App port
server.port=${PORT:8080}
server.address=0.0.0.0

# JWT secret
authorization.jwt.secret=${JWT_SECRET}
