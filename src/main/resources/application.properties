# Spring Application Name
spring.application.name=BevTrace Platform

# Default profile
spring.profiles.default=dev

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.codecraft.bevtrace.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Application Information for Documentation
documentation.application.title=BevTrace API
documentation.application.description=BevTrace Platform REST API Documentation
documentation.application.version=1.0.0
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration Properties
authorization.jwt.secret=WriteHereYourSecretStringForTokenSigningCredentials
authorization.jwt.expiration.days=7

# CORS (comma separated origins of the Angular app)
bevtrace.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Background jobs (off by default so demo data is not modified)
bevtrace.telemetry.monitor.enabled=false
bevtrace.incident.detection.enabled=false

management.endpoints.web.exposure.include=health
